<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Ký Tài Khoản</title>
</head>
<body>
    <h1 align="center">Đăng Ký Tài Khoản</h1>
    <form action="" method="POST">  
        <label for="hoten">Họ và tên:</label><br>
        <input type="text" id="hoten" name="hoten" placeholder="Nhập họ và tên"><br><br>

        <label for="email">Email:</label><br>
        <input type="email" id="email" name="email" placeholder="example@gmail.com"><br><br>

        <label for="matkhau">Mật khẩu:</label><br>
        <input type="password" id="matkhau" name="matkhau" placeholder="Nhập mật khẩu"><br><br>

        <label>Giới tính:</label><br>
        <input type="radio" id="nam" name="gioitinh" value="nam" checked>
        <label for="nam">Nam</label>
        
        <input type="radio" id="nu" name="gioitinh" value="nu">
        <label for="nu">Nữ</label><br><br>

        <input type="submit" value="Đăng ký">
    </form>
</body>
</html>
